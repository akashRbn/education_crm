<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Main hexagon -->
  <polygon points="20,2 37,11 37,29 20,38 3,29 3,11"
           fill="url(#mainGradient)"/>

  <!-- Inner hexagon outline -->
  <polygon points="20,7 32,14 32,26 20,33 8,26 8,14"
           fill="none"
           stroke="url(#accentGradient)"
           stroke-width="1"
           opacity="0.5"/>

  <!-- Graduation cap / book shape -->
  <path d="M20 12 L31 18 L20 24 L9 18 Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Tassel -->
  <path d="M20 24 L20 32"
        stroke="#ffffff"
        stroke-width="1.5"
        opacity="0.8"/>

  <!-- Tassel end -->
  <circle cx="20" cy="33" r="2.5" fill="#10b981"/>

  <!-- Top accent -->
  <circle cx="20" cy="5" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
