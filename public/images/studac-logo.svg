<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized hexagon with graduation cap -->
  <g transform="translate(5, 7)">
    <!-- Base hexagon -->
    <polygon points="18,2 33,10 33,26 18,34 3,26 3,10" fill="url(#iconGradient)" opacity="0.95"/>
    <!-- Inner glow ring -->
    <polygon points="18,6 29,12 29,24 18,30 7,24 7,12" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
    <!-- Book/cap shape -->
    <path d="M18 10 L29 16 L18 22 L7 16 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
    <!-- Tassel -->
    <path d="M18 22 L18 29" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="18" cy="30" r="2.5" fill="#10b981"/>
  </g>

  <!-- Text: STUDAC -->
  <text x="48" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="url(#brandGradient)" letter-spacing="-0.5">
    STUDAC
  </text>
</svg>
